syntax = "proto3";

package api.order.v1;

option go_package = "dd_web/back/api/order/v1;orderv1";

import "api/common/v1/common.proto";
import "google/protobuf/struct.proto";
import "third_party/google/api/annotations.proto";

message CoachOrdersRequest {
  int32 page_size = 1;
  string cursor = 2;
  string status = 3;
}

message CoachOrderDetailRequest {
  string order_id = 1;
}

message CoachOrderEventsRequest {
  string order_id = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message CoachAcceptOrderRequest {
  string order_id = 1;
}

message CoachRejectOrderRequest {
  string order_id = 1;
  api.common.v1.Reason body = 2;
}

message CoachStartOrderRequest {
  string order_id = 1;
}

message CoachCompleteOrderRequest {
  string order_id = 1;
  api.common.v1.Completion body = 2;
}

message CoachEarningsSummaryRequest {
  google.protobuf.Struct empty = 1;
}

message CoachEarningsItemsRequest {
  int32 page_size = 1;
  string cursor = 2;
}

message CoachSettlementsRequest {
  int32 page_size = 1;
  string cursor = 2;
}

message CoachSettlementDetailRequest {
  string batch_id = 1;
}

message CoachSupplementsRequest {
  int32 page_size = 1;
  string cursor = 2;
}

message CoachSettlementAccountRequest {
  google.protobuf.Struct empty = 1;
}

message CoachOnboardingRequest {
  api.common.v1.Onboarding body = 1;
}

service CoachOrderService {
  rpc CoachOrders (CoachOrdersRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      get: "/api/v1/coach/orders"
    };
  }
  rpc CoachOrderDetail (CoachOrderDetailRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      get: "/api/v1/coach/orders/{order_id}"
    };
  }
  rpc CoachOrderEvents (CoachOrderEventsRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      get: "/api/v1/coach/orders/{order_id}/events"
    };
  }
  rpc CoachAcceptOrder (CoachAcceptOrderRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      post: "/api/v1/coach/orders/{order_id}/accept"
    };
  }
  rpc CoachRejectOrder (CoachRejectOrderRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      post: "/api/v1/coach/orders/{order_id}/reject"
      body: "body"
    };
  }
  rpc CoachStartOrder (CoachStartOrderRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      post: "/api/v1/coach/orders/{order_id}/start"
    };
  }
  rpc CoachCompleteOrder (CoachCompleteOrderRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      post: "/api/v1/coach/orders/{order_id}/complete"
      body: "body"
    };
  }
  rpc CoachEarningsSummary (CoachEarningsSummaryRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      get: "/api/v1/coach/earnings/summary"
    };
  }
  rpc CoachEarningsItems (CoachEarningsItemsRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      get: "/api/v1/coach/earnings/items"
    };
  }
  rpc CoachSettlements (CoachSettlementsRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      get: "/api/v1/coach/settlements"
    };
  }
  rpc CoachSettlementDetail (CoachSettlementDetailRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      get: "/api/v1/coach/settlements/{batch_id}"
    };
  }
  rpc CoachSupplements (CoachSupplementsRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      get: "/api/v1/coach/settlement-supplements"
    };
  }
  rpc CoachSettlementAccount (CoachSettlementAccountRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      get: "/api/v1/coach/settlement-account"
    };
  }
  rpc CoachOnboarding (CoachOnboardingRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      post: "/api/v1/coach/settlement-account/onboarding"
      body: "body"
    };
  }
}
