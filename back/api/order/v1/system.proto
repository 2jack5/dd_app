syntax = "proto3";
package api.order.v1;
option go_package = "dd_web/back/api/order/v1;orderv1";
import "api/common/v1/common.proto";
import "google/protobuf/struct.proto";
import "third_party/google/api/annotations.proto";
message SystemHealthRequest { google.protobuf.Struct empty = 1; }
message SystemReadyRequest { google.protobuf.Struct empty = 1; }
service SystemService {
  rpc SystemHealth(SystemHealthRequest) returns (api.common.v1.ApiResponse) { option (google.api.http) = { get: "/healthz" }; }
  rpc SystemReady(SystemReadyRequest) returns (api.common.v1.ApiResponse) { option (google.api.http) = { get: "/readyz" }; }
}
