syntax = "proto3";

package api.order.v1;

option go_package = "dd_web/back/api/order/v1;orderv1";

import "api/common/v1/common.proto";
import "google/protobuf/struct.proto";
import "third_party/google/api/annotations.proto";

message WalletCurrentRequest {}

message RechargePackagesRequest {
  int32 page_size = 1;
  string cursor = 2;
}

message RechargeCreateBody {
  string package_id = 1;
  string provider = 2;
  string client_type = 3;
}

message RechargeCreateRequest {
  RechargeCreateBody body = 1;
}

message RechargeDetailRequest {
  string recharge_id = 1;
}

message RechargeListRequest {
  int32 page_size = 1;
  string cursor = 2;
  string status = 3;
}

message WalletTransactionsRequest {
  int32 page_size = 1;
  string cursor = 2;
  string type = 3;
}

message WalletCallbackRequest {
  string provider = 1;
  google.protobuf.Struct body = 2;
}

message AdminRechargePackagesRequest {
  int32 page_size = 1;
  string cursor = 2;
  string status = 3;
}

message RechargePackageBody {
  string name = 1;
  string pay_amount = 2;
  string package_multiplier = 3;
  string currency = 4;
  string asset_code = 5;
  string status = 6;
  string effective_at = 7;
  string expires_at = 8;
  int32 version = 9;
}

message AdminCreateRechargePackageRequest {
  RechargePackageBody body = 1;
}

message AdminUpdateRechargePackageRequest {
  string package_id = 1;
  RechargePackageBody body = 2;
}

service WalletService {
  rpc WalletCurrent(WalletCurrentRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = { get: "/api/v1/wallet" };
  }
  rpc RechargePackages(RechargePackagesRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = { get: "/api/v1/wallet/recharge-packages" };
  }
  rpc RechargeCreate(RechargeCreateRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      post: "/api/v1/wallet/recharges"
      body: "body"
    };
  }
  rpc RechargeDetail(RechargeDetailRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = { get: "/api/v1/wallet/recharges/{recharge_id}" };
  }
  rpc RechargeList(RechargeListRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = { get: "/api/v1/wallet/recharges" };
  }
  rpc WalletTransactions(WalletTransactionsRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = { get: "/api/v1/wallet/transactions" };
  }
}

service WalletCallbackService {
  rpc WalletCallback(WalletCallbackRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      post: "/api/v1/callbacks/wallet/{provider}"
      body: "body"
    };
  }
}

service AdminWalletService {
  rpc AdminRechargePackages(AdminRechargePackagesRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = { get: "/api/v1/admin/wallet/recharge-packages" };
  }
  rpc AdminCreateRechargePackage(AdminCreateRechargePackageRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/wallet/recharge-packages"
      body: "body"
    };
  }
  rpc AdminUpdateRechargePackage(AdminUpdateRechargePackageRequest) returns (api.common.v1.ApiResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/wallet/recharge-packages/{package_id}"
      body: "body"
    };
  }
}
